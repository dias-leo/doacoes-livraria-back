spring.application.name=livraria-doacoes

# Use the PORT environment variable (Render sets $PORT). Default to 8080 for local dev.
server.port=${PORT:8080}

# Datasource settings - prefer environment variables for production
# You can set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD in your Render service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
# Default username/password are intentionally generic placeholders ? set SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD in your environment for production
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
